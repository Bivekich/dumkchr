services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dumkchr-frontend
    restart: unless-stopped
    # Coolify проксирует на контейнерный порт; host-port не фиксируем
    ports:
      - '3000'
    env_file:
      - stack.env
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          'http://127.0.0.1:3000',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
